document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ace\">\n              <span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:{{ d.titleColor }}\">{{ d.label }}<\u002Fspan>\n              <span style=\"font-size:16px;line-height:1.25\">{{ d.desc }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start\">\n        <div style=\"flex:1 1 640px;display:flex;flex-direction:column;gap:8px;min-width:0\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:10px;color:#9d93bb\">2. ELIGE NIVEL<\u002Fspan>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px\">\n            <sc-for list=\"{{ menuLevels }}\" as=\"l\" hint-placeholder-count=\"7\">\n              <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"padding:0;border:3px solid #000;background:#221d33;color:#f3ecd8;box-shadow:{{ l.shadow }};cursor:{{ l.cursor }};display:flex;flex-direction:column;text-align:left;font-family:'Pixelify Sans',monospace;opacity:{{ l.opacity }}\" style-hover=\"background:#2e2745\">\n                <div style=\"position:relative;width:100%;aspect-ratio:640/352;background:#0b0914;border-bottom:3px solid #000;overflow:hidden\">\n                  <canvas data-thumb=\"{{ l.idx }}\" data-locked=\"{{ l.lockedStr }}\" width=\"640\" height=\"352\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><\u002Fcanvas>\n                  <span style=\"position:absolute;top:6px;left:6px;font-family:'Press Start 2P',monospace;font-size:10px;background:#000;color:#ffcc33;padding:4px 6px\">{{ l.num }}<\u002Fspan>\n                  <sc-if value=\"{{ l.locked }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:10px;color:#f3ecd8;text-shadow:2px 2px 0 #000\">BLOQUEADO<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"padding:8px 10px;display:flex;flex-direction:column;gap:5px\">\n                  <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.4\">{{ l.name }}<\u002Fspan>\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:6px\">\n                    <span style=\"color:{{ l.starColor }};font-size:16px;letter-spacing:2px\">{{ l.stars }}<\u002Fspan>\n                    <span style=\"font-size:14px;color:#9d93bb\">{{ l.waves }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 280px;max-width:420px;display:flex;flex-direction:column;gap:10px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:10px;color:#9d93bb\">CÓMO SE JUEGA<\u002Fspan>\n          <div style=\"background:#221d33;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.3\">\n            <div style=\"display:flex;gap:10px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#ffcc33\">1<\u002Fspan><span><b>Construye.<\u002Fb> Coloca trampas con tu oro sobre la rejilla.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#ffcc33\">2<\u002Fspan><span><b>Suelta la oleada.<\u002Fb> Los héroes corren solos hacia el castillo.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:10px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#ffcc33\">3<\u002Fspan><span><b>Defiende.<\u002Fb> Cada héroe que entra quita un corazón. Cada baja da oro para la siguiente oleada.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:10px;color:#9d93bb\">LOS HÉROES<\u002Fspan>\n          <div style=\"background:#221d33;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:15px;line-height:1.2\">\n            <canvas data-icon=\"hero-normal\" width=\"16\" height=\"20\" style=\"width:32px;height:40px;image-rendering:pixelated\"><\u002Fcanvas><span><b>Aventurero.<\u002Fb> Salta huecos y paredes bajas.<\u002Fspan>\n            <canvas data-icon=\"hero-fast\" width=\"16\" height=\"20\" style=\"width:32px;height:40px;image-rendering:pixelated\"><\u002Fcanvas><span><b>Rápido.<\u002Fb> Corre el doble y salta más lejos.<\u002Fspan>\n            <canvas data-icon=\"hero-jumper\" width=\"16\" height=\"20\" style=\"width:32px;height:40px;image-rendering:pixelated\"><\u002Fcanvas><span><b>Saltarín.<\u002Fb> Brinca alto y aplasta esbirros.<\u002Fspan>\n            <canvas data-icon=\"hero-shield\" width=\"16\" height=\"20\" style=\"width:32px;height:40px;image-rendering:pixelated\"><\u002Fcanvas><span><b>Escudo.<\u002Fb> Aguanta un golpe antes de caer.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:14px;color:#8f86ad;line-height:1.3\">Si encierras a los héroes, rompen tus bloques. Supera un nivel para desbloquear el siguiente.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <header style=\"flex:0 0 auto;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap\">\n    <h1 style=\"margin:0;font-family:'Press Start 2P',monospace;font-size:18px;color:#ffcc33;text-shadow:2px 2px 0 #b8322a,4px 4px 0 #000;white-space:nowrap\">DON TRAMPAS<\u002Fh1>\n    <button sc-camel-on-click=\"{{ onMenu }}\" style=\"font-family:'Press Start 2P',monospace;font-size:8px;padding:7px 9px;border:3px solid #000;background:#3a3452;color:#f3ecd8;box-shadow:2px 2px 0 #000;cursor:pointer\">◀ MENU<\u002Fbutton>\n    <div style=\"display:flex;flex-direction:column;gap:3px\">\n      <span style=\"font-family:'Press Start 2P',monospace;font-size:9px;color:#f3ecd8\">{{ levelTitle }}<\u002Fspan>\n      <span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:{{ diffColor }}\">{{ diffTitle }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-left:auto\">\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:#9d93bb\">ORO<\u002Fspan><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#ffcc33\">{{ gold }}<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:#9d93bb\">OLEADA<\u002Fspan><span style=\"font-family:'Press Start 2P',monospace;font-size:12px\">{{ waveLabel }}<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:#9d93bb\">CASTILLO<\u002Fspan><div style=\"display:flex;gap:2px;font-size:13px;line-height:1\"><sc-for list=\"{{ hearts }}\" as=\"h\" hint-placeholder-count=\"5\"><span style=\"color:{{ h.c }}\">♥<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:#9d93bb\">BAJAS<\u002Fspan><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#ff6a5a\">{{ dead }}<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px\"><span style=\"font-family:'Press Start 2P',monospace;font-size:7px;color:#9d93bb\">EN CAMINO<\u002Fspan><span style=\"font-family:'Press Start 2P',monospace;font-size:12px;color:#9fe0ff\">{{ pending }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1 1 auto;min-height:0;display:flex;gap:12px\">\n    <div style=\"flex:1 1 auto;min-width:0;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center\">\n      <div style=\"position:relative;width:min(calc(100cqw - 12px),calc((100cqh - 12px) * 1.818));aspect-ratio:640/352;border:4px solid #000;box-shadow:0 0 0 3px #3a3452,6px 6px 0 3px #000;background:#0b0914;overflow:hidden\">\n        <canvas ref=\"{{ bgRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\"><\u002Fcanvas>\n        <canvas ref=\"{{ canvasRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none\"><\u002Fcanvas>\n        <sc-if value=\"{{ showOverlay }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;inset:0;background:rgba(10,8,20,0.72);display:flex;align-items:center;justify-content:center;padding:16px\">\n            <div style=\"background:#221d33;border:4px solid #000;box-shadow:0 0 0 3px #ffcc33,8px 8px 0 3px #000;padding:clamp(14px,2.5vw,28px);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:520px;text-align:center\">\n              <sc-if value=\"{{ showStars }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:10px;font-size:clamp(26px,4vw,44px);line-height:1\">\n                  <sc-for list=\"{{ resultStars }}\" as=\"s\" hint-placeholder-count=\"3\"><span style=\"color:{{ s.c }};text-shadow:3px 3px 0 #000\">★<\u002Fspan><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-family:'Press Start 2P',monospace;font-size:clamp(12px,2vw,18px);line-height:1.4;color:{{ resultColor }}\">{{ resultTitle }}<\u002Fdiv>\n              <div style=\"font-size:18px;color:#e4dcf4\">{{ resultText }}<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center\">\n                <sc-for list=\"{{ resultButtons }}\" as=\"b\" hint-placeholder-count=\"1\">\n                  <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"font-family:'Press Start 2P',monospace;font-size:10px;padding:11px 13px;border:3px solid #000;background:{{ b.bg }};color:#1a1020;box-shadow:4px 4px 0 #000;cursor:pointer\" style-active=\"transform:translate(2px,2px);box-shadow:2px 2px 0 #000\">{{ b.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside style=\"flex:0 0 244px;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:2px 4px 4px 0\">\n      <div style=\"background:#221d33;border:3px solid #000;box-shadow:2px 2px 0 #000;padding:4px 8px;display:flex;flex-direction:column;gap:2px;padding:6px 8px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.4;color:{{ modeColor }}\">{{ modeLabel }}<\u002Fspan>\n        <span style=\"font-size:12px;line-height:1.2;color:#b9b0d0\">{{ typesLabel }}<\u002Fspan><span style=\"font-size:11px;line-height:1.25;color:#8f86ad\">Clic: colocar · Clic dcho./Quitar: retirar · R: girar · Espacio: soltar<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;opacity:{{ toolsOpacity }}\">\n        <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"11\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" title=\"{{ t.name }}\" style=\"position:relative;padding:3px 1px;border:2px solid #000;background:{{ t.bg }};color:{{ t.fg }};box-shadow:2px 2px 0 #000;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:'Pixelify Sans',monospace;min-width:0\">\n            <span style=\"position:absolute;top:2px;left:3px;font-family:'Press Start 2P',monospace;font-size:6px;opacity:0.7\">{{ t.key }}<\u002Fspan>\n            <canvas data-icon=\"{{ t.id }}\" width=\"26\" height=\"26\" style=\"width:26px;height:26px;image-rendering:pixelated\"><\u002Fcanvas>\n            <span style=\"font-size:10px;font-weight:600;line-height:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%\">{{ t.name }}<\u002Fspan>\n            <span style=\"font-family:'Press Start 2P',monospace;font-size:6px;color:{{ t.costColor }}\">{{ t.costLabel }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onRun }}\" style=\"font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.5;padding:11px 8px;border:3px solid #000;background:{{ runBg }};color:#1a1020;box-shadow:3px 3px 0 #000;cursor:pointer\" style-active=\"transform:translate(2px,2px);box-shadow:1px 1px 0 #000\">{{ runLabel }}<\u002Fbutton>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px\">\n        <button sc-camel-on-click=\"{{ onRotate }}\" style=\"font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.5;padding:8px 6px;border:3px solid #000;background:#3a3452;color:#f3ecd8;box-shadow:3px 3px 0 #000;cursor:pointer\">{{ dirLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onClear }}\" style=\"font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.5;padding:8px 6px;border:3px solid #000;background:#3a3452;color:#f3ecd8;box-shadow:3px 3px 0 #000;cursor:pointer\">VACIAR<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onMute }}\" style=\"font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.5;padding:8px 6px;border:3px solid #000;background:#3a3452;color:#f3ecd8;box-shadow:3px 3px 0 #000;cursor:pointer\">{{ muteLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      \n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroes&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:15,&quot;min&quot;:5,&quot;max&quot;:40,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Partida&quot;},&quot;gold&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Tacaño&quot;,&quot;Normal&quot;,&quot;Rico&quot;],&quot;default&quot;:&quot;Normal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Partida&quot;},&quot;trajectory&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Editor&quot;}}\">\nclass Component extends DCLogic {\n  state = { s: null, screen: 'menu', thumbs: [] };\n  canvasRef = React.createRef();\n  bgRef = React.createRef();\n  rootRef = React.createRef();\n  opts() {\n    const gm = { 'Tacaño': 0.7, 'Normal': 1, 'Rico': 1.6 };\n    return { heroes: this.props.heroes ?? 15, goldMult: gm[this.props.gold ?? 'Normal'] ?? 1, traj: this.props.trajectory ?? true };\n  }\n  componentDidMount() {\n    const boot = () => {\n      if (!window.DonTrampas || !this.canvasRef.current || !this.bgRef.current) { this._b = setTimeout(boot, 50); return; }\n      this.game = new window.DonTrampas(this.canvasRef.current, this.bgRef.current, s => this.setState({ s }), this.opts());\n      window.__dt = this.game;\n      setTimeout(() => { if (!this.game) return; this._thumbs = []; for (let i = 0; i < 7; i++) this._thumbs.push(this.game.thumb(i)); this.paintThumbs(); }, 400);\n      setTimeout(() => this.game && this.game.drawIcons(this.rootRef.current), 300);\n    };\n    boot();\n  }\n  paintThumbs() {\n    const root = this.rootRef.current; if (!root || !this._thumbs) return;\n    root.querySelectorAll('canvas[data-thumb]').forEach(cv => {\n      const src = this._thumbs[+cv.getAttribute('data-thumb')]; if (!src) return;\n      const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; g.filter = 'none'; g.clearRect(0, 0, 640, 352); g.drawImage(src, 0, 0);\n      if (cv.getAttribute('data-locked') === '1') { const d = g.getImageData(0, 0, 640, 352), p = d.data; for (let k = 0; k < p.length; k += 4) { const y = (p[k] * 0.3 + p[k + 1] * 0.59 + p[k + 2] * 0.11) * 0.45; p[k] = p[k + 1] = p[k + 2] = y; } g.putImageData(d, 0, 0); }\n    });\n  }\n  componentWillUnmount() { clearTimeout(this._b); this.game && this.game.destroy(); }\n  componentDidUpdate(pp) {\n    if (!this.game) return;\n    if (pp.heroes !== this.props.heroes || pp.gold !== this.props.gold || pp.trajectory !== this.props.trajectory) this.game.setOptions(this.opts());\n    this.game.drawIcons(this.rootRef.current);\n    this.paintThumbs();\n  }\n  renderVals() {\n    const s = this.state.s || { mode: 'build', gold: 0, tool: 'block', dir: -1, levels: [], wave: 1, waves: 3, hp: 5, maxHp: 5, dead: 0, pending: 0, tools: [], types: [], diffs: [], diff: 'normal', totalStars: 0, maxStars: 21, levelName: '' };\n    const na = t => String(t).normalize('NFD').replace(/[\\u0300-\\u036f]/g, '');\n    const DC = { facil: ['#7dff8a', 'Menos héroes, más oro y 7 corazones.'], normal: ['#ffcc33', 'La experiencia prevista. 5 corazones.'], pesadilla: ['#ff6a5a', 'Hordas, héroes listos, poco oro y 3 corazones.'] };\n    const goMenu = () => this.setState({ screen: 'menu' });\n    const g = () => this.game;\n    const call = (fn) => () => { const x = g(); if (x) fn(x); };\n    const building = s.mode === 'build';\n    const typeNames = { fast: 'rápidos', jumper: 'saltarines', shield: 'con escudo' };\n    const modes = { build: ['CONSTRUYE TU TRAMPA', '#7dff8a'], run: ['¡AHÍ VIENEN!', '#ff6a5a'], wave: ['OLEADA SUPERADA', '#ffcc33'], win: ['NIVEL SUPERADO', '#ffcc33'], lose: ['DERROTA', '#ff6a5a'] };\n    const r = s.result || {};\n    let buttons = [], title = r.title || '', text = '', color = '#ffcc33';\n    if (s.mode === 'wave') { text = `${r.dead} bajas · +${r.gold} de oro · Siguiente: ${r.nextSize} héroes`; buttons = [{ label: `PREPARAR OLEADA ${r.next}`, bg: '#ffcc33', onClick: call(x => x.toBuild()) }]; }\n    if (s.mode === 'win') { text = `Castillo con ${r.hp}/${s.maxHp} corazones · ${r.dead} bajas en la última oleada`; buttons = [{ label: 'MENU', bg: '#c9c1e0', onClick: goMenu }, { label: 'REPETIR', bg: '#c9c1e0', onClick: call(x => x.resetLevel()) }]; if (s.hasNext) buttons.push({ label: 'SIGUIENTE NIVEL', bg: '#ffcc33', onClick: call(x => x.next()) }); }\n    if (s.mode === 'lose') { color = '#ff6a5a'; text = `Cayó en la oleada ${r.wave}. Reorganiza tus trampas y vuelve a intentarlo.`; buttons = [{ label: 'MENU', bg: '#c9c1e0', onClick: goMenu }, { label: 'REINTENTAR NIVEL', bg: '#ffcc33', onClick: call(x => x.resetLevel()) }]; }\n    return {\n      showMenu: this.state.screen === 'menu', onMenu: goMenu,\n      levelTitle: na(`NIVEL ${s.level + 1} · ${s.levelName}`).toUpperCase(),\n      diffTitle: na((s.diffs.find(d => d.id === s.diff) || { name: '' }).name).toUpperCase(), diffColor: (DC[s.diff] || DC.normal)[0],\n      starsLabel: `${s.totalStars}/${s.maxStars}`,\n      diffs: s.diffs.map(d => { const sel = d.id === s.diff; return { label: na(d.name).toUpperCase(), desc: (DC[d.id] || ['', ''])[1], bg: sel ? '#2e2745' : '#221d33', fg: '#f3ecd8', titleColor: sel ? (DC[d.id] || DC.normal)[0] : '#9d93bb',\n        onClick: call(x => { if (x.mode === 'run') x.toBuild(); x.setDifficulty(d.id); }) }; }),\n      menuLevels: s.levels.map((l, i) => ({ num: String(i + 1), name: na(l.name).toUpperCase(), idx: String(i), lockedStr: l.unlocked ? '0' : '1', locked: !l.unlocked,\n        stars: '★★★'.slice(0, l.best) + '☆☆☆'.slice(0, 3 - l.best), starColor: l.best ? '#ffcc33' : '#6a6288', waves: l.waves + ' oleadas',\n        opacity: l.unlocked ? 1 : 0.6, filter: l.unlocked ? 'none' : 'grayscale(1) brightness(0.5)', cursor: l.unlocked ? 'pointer' : 'not-allowed', shadow: i === s.level ? '0 0 0 3px #ffcc33, 5px 5px 0 3px #000' : '3px 3px 0 #000',\n        onClick: l.unlocked ? call(x => { x.loadLevel(i); this.setState({ screen: 'game' }); }) : () => {} })),\n      canvasRef: this.canvasRef, bgRef: this.bgRef, rootRef: this.rootRef,\n      levels: s.levels.map((l, i) => ({ label: `${i + 1}. ${l.name.toUpperCase()}`, stars: '★★★'.slice(0, l.best) + '☆☆☆'.slice(0, 3 - l.best), starColor: l.best ? '#ffcc33' : '#6a6288',\n        bg: i === s.level ? '#ffcc33' : '#2a2540', fg: i === s.level ? '#1a1020' : '#f3ecd8', onClick: call(x => x.setLevel(i)) })),\n      gold: s.gold, waveLabel: `${s.wave}/${s.waves}`, dead: s.dead, pending: s.pending,\n      hearts: Array.from({ length: s.maxHp }, (_, i) => ({ c: i < s.hp ? '#ff4a4a' : '#3a3452' })),\n      modeLabel: na((modes[s.mode] || modes.build)[0]), modeColor: (modes[s.mode] || modes.build)[1],\n      typesLabel: 'Héroes: normales' + s.types.map(t => ', ' + typeNames[t]).join(''),\n      tools: s.tools.map(t => { const sel = t.id === s.tool, afford = t.cost <= s.gold;\n        return { id: t.id, name: t.id === 'sling' ? 'Honda' : t.name, key: t.key, costLabel: t.cost ? t.cost + ' oro' : 'gratis', costColor: sel ? '#1a1020' : afford ? '#ffcc33' : '#ff6a5a',\n          bg: sel ? '#ffcc33' : '#2a2540', fg: sel ? '#1a1020' : '#f3ecd8', onClick: call(x => x.setTool(t.id)) }; }),\n      toolsOpacity: building ? 1 : 0.45,\n      runLabel: building ? `▶ SOLTAR OLEADA ${s.wave}` : s.mode === 'run' ? 'OLEADA EN CURSO…' : '—',\n      runBg: building ? '#7dff8a' : '#6a6288', onRun: call(x => x.run()),\n      dirLabel: s.dir < 0 ? 'GIRO ◀' : 'GIRO ▶', onRotate: call(x => x.rotate()), onClear: call(x => x.clear()),\n      muteLabel: s.muted ? 'SON: NO' : 'SON: SI', onMute: call(x => x.toggleMute()),\n      showOverlay: ['wave', 'win', 'lose'].includes(s.mode), showStars: s.mode === 'win',\n      resultStars: [0, 1, 2].map(i => ({ c: i < (r.stars || 0) ? '#ffcc33' : '#3a3452' })),\n      resultTitle: na(title), resultText: text, resultColor: color, resultButtons: buttons,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
